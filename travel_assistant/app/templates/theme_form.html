{% extends "base.html" %}

{% block title %}{% if theme %}Edit{% else %}New{% endif %} Theme – Travel Assistant{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="mb-6">
    <a href="{% if theme %}{{ base }}/theme/{{ theme.id }}{% else %}{{ base }}/{% endif %}"
       class="text-sm text-slate-500 hover:text-brand-700">← Back</a>
    <h1 class="mt-2 text-2xl font-bold text-slate-900">
      {% if theme %}Edit theme{% else %}New theme{% endif %}
    </h1>
  </div>

  <form method="post" action="{{ action }}" class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-5">
    <div>
      <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name *</label>
      <input type="text" id="name" name="name" required
             value="{{ theme.name if theme else '' }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
             placeholder="e.g. English Heritage">
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Description</label>
      <textarea id="description" name="description" rows="3"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                placeholder="Optional short description">{{ theme.description if theme else '' }}</textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="primary_color" class="block text-sm font-medium text-slate-700 mb-1">Primary</label>
        <div class="flex items-center gap-2">
          <input type="color" id="primary_swatch"
                 value="{{ theme.primary_color if theme and theme.primary_color else '#0d9488' }}"
                 class="w-10 h-10 rounded border border-slate-300 cursor-pointer p-0.5"
                 oninput="document.getElementById('primary_color').value=this.value">
          <input type="text" id="primary_color" name="primary_color"
                 value="{{ theme.primary_color if theme and theme.primary_color else '#0d9488' }}"
                 pattern="^#[0-9A-Fa-f]{6}$"
                 class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                 oninput="if(/^#[0-9A-Fa-f]{6}$/.test(this.value)) document.getElementById('primary_swatch').value=this.value">
        </div>
      </div>
      <div>
        <label for="secondary_color" class="block text-sm font-medium text-slate-700 mb-1">Secondary</label>
        <div class="flex items-center gap-2">
          <input type="color" id="secondary_swatch"
                 value="{{ theme.secondary_color if theme and theme.secondary_color else '#134e4a' }}"
                 class="w-10 h-10 rounded border border-slate-300 cursor-pointer p-0.5"
                 oninput="document.getElementById('secondary_color').value=this.value">
          <input type="text" id="secondary_color" name="secondary_color"
                 value="{{ theme.secondary_color if theme and theme.secondary_color else '#134e4a' }}"
                 pattern="^#[0-9A-Fa-f]{6}$"
                 class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                 oninput="if(/^#[0-9A-Fa-f]{6}$/.test(this.value)) document.getElementById('secondary_swatch').value=this.value">
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" name="is_active" value="on" class="sr-only peer"
               {% if not theme or theme.is_active %}checked{% endif %}>
        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-brand-500 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-600"></div>
      </label>
      <span class="text-sm font-medium text-slate-700">Active</span>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2">
      <a href="{% if theme %}{{ base }}/theme/{{ theme.id }}{% else %}{{ base }}/{% endif %}"
         class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800">Cancel</a>
      <button type="submit"
              class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg">
        Save
      </button>
    </div>
  </form>

  {% if theme %}
  <form method="post" action="{{ base }}/theme/{{ theme.id }}/delete" class="mt-6 text-center"
        onsubmit="return confirm('Delete this theme and all its places?');">
    <button type="submit" class="text-sm text-red-600 hover:text-red-700 font-medium">
      Delete this theme
    </button>
  </form>
  {% endif %}
</div>
{% endblock %}
