<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Travel Assistant{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --ui-bg: {{ ui.bg_color }};
      --ui-sidebar: {{ ui.sidebar_color }};
      --ui-sidebar-text: {{ ui.sidebar_text_color }};
      --ui-sidebar-active: {{ ui.sidebar_active_color }};
      --ui-accent: {{ ui.accent_color }};
    }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--ui-bg); }
    .leaflet-container { z-index: 0; }
    #sidebar {
      background: var(--ui-sidebar);
      color: var(--ui-sidebar-text);
    }
    #sidebar .nav-link { color: var(--ui-sidebar-text); opacity: 0.85; }
    #sidebar .nav-link:hover { background: var(--ui-sidebar-active); opacity: 1; }
    #sidebar .nav-link.nav-active {
      background: var(--ui-sidebar-active);
      opacity: 1;
      color: #fff;
    }
    #sidebar .brand-icon { background: var(--ui-accent); }
    #main-header { background: color-mix(in srgb, var(--ui-bg) 90%, transparent); }

    #sidebar.collapsed { width: 4.5rem; }
    #sidebar.collapsed .nav-label,
    #sidebar.collapsed .brand-text { display: none; }
    #sidebar.collapsed .nav-link { justify-content: center; padding-left: 0.75rem; padding-right: 0.75rem; }
    #sidebar.collapsed .sidebar-header {
      flex-direction: column;
      justify-content: center;
      gap: 0.35rem;
      height: auto;
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    #sidebar.collapsed .sidebar-header .brand-link { margin: 0; }
    #sidebar.collapsed .collapse-btn-expanded { display: none; }
    #sidebar:not(.collapsed) .collapse-btn-collapsed { display: none; }
    #sidebar.collapsed .collapse-btn-collapsed { display: flex; }

    #main-wrap { margin-left: 16rem; transition: margin-left 0.2s ease; }
    #sidebar.collapsed ~ #main-wrap { margin-left: 4.5rem; }
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.mobile-open { transform: translateX(0); }
      #main-wrap { margin-left: 0 !important; }
      #sidebar-backdrop.show { display: block; }
      .mobile-stack { flex-direction: column !important; align-items: stretch !important; }
      .mobile-stack > * { width: 100%; }
      button, .btn, a.px-4, a.px-5 { min-height: 44px; }
      .page-pad { padding-left: 1rem !important; padding-right: 1rem !important; }
      table { display: block; overflow-x: auto; }
      .map-h { height: 18rem !important; }
    }
    body.is-companion .desktop-only { display: none; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full text-slate-800">
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"
       onclick="closeMobileSidebar()"></div>

  <aside id="sidebar"
         class="fixed top-0 left-0 z-50 h-full w-64 flex flex-col transition-all duration-200 ease-in-out">
    <div class="sidebar-header flex items-center gap-3 px-3 h-16 border-b border-white/10 flex-shrink-0">
      <a href="{{ base }}/" class="brand-link flex items-center gap-2.5 min-w-0">
        <span class="brand-icon w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </span>
        <span class="brand-text font-semibold text-base truncate">Travel Assistant</span>
      </a>
      <button type="button" onclick="toggleSidebar()"
              class="collapse-btn-expanded ml-auto p-1.5 rounded-lg opacity-70 hover:opacity-100 hover:bg-white/10 hidden md:flex"
              title="Collapse sidebar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
      </button>
      <button type="button" onclick="toggleSidebar()"
              class="collapse-btn-collapsed p-1.5 rounded-lg opacity-70 hover:opacity-100 hover:bg-white/10 hidden md:flex"
              title="Expand sidebar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="{{ base }}/"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition
                {% if active_nav == 'dashboard' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v2a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 13a1 1 0 011-1h4a1 1 0 011 1v6a1 1 0 01-1 1h-4a1 1 0 01-1-1v-6z"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="{{ base }}/themes"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition
                {% if active_nav == 'themes' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
        </svg>
        <span class="nav-label">Categories</span>
      </a>
      <a href="{{ base }}/places"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition
                {% if active_nav == 'places' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="nav-label">Places</span>
      </a>
      <a href="{{ base }}/trips"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition
                {% if active_nav == 'trips' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
        </svg>
        <span class="nav-label">Trips</span>
      </a>
      <a href="{{ base }}/packing"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition
                {% if active_nav == 'packing' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
        <span class="nav-label">Store cupboard</span>
      </a>
      <a href="{{ base }}/achievements"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition
                {% if active_nav == 'achievements' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
        </svg>
        <span class="nav-label">Achievements</span>
      </a>
    </nav>

    <div class="px-3 py-4 border-t border-white/10">
      <a href="{{ base }}/settings"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition
                {% if active_nav == 'settings' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="nav-label">Settings</span>
      </a>
    </div>
  </aside>

  <div id="main-wrap" class="min-h-full flex flex-col">
    <header id="main-header" class="sticky top-0 z-30 backdrop-blur border-b border-slate-200/80 h-14 flex items-center px-4 sm:px-6 lg:px-8 gap-3">
      <button type="button" onclick="openMobileSidebar()"
              class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-black/5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>
      </button>
      <div class="text-sm text-slate-500">{% block topbar %}Travel Assistant{% endblock %}</div>
    </header>

    <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 max-w-7xl w-full mx-auto">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      const sb = document.getElementById('sidebar');
      const key = 'ta-sidebar-collapsed';
      try {
        if (localStorage.getItem(key) === '1' && window.innerWidth >= 768) {
          sb.classList.add('collapsed');
        }
      } catch (e) {}

      window.toggleSidebar = function () {
        sb.classList.toggle('collapsed');
        try {
          localStorage.setItem(key, sb.classList.contains('collapsed') ? '1' : '0');
        } catch (e) {}
      };
      window.openMobileSidebar = function () {
        sb.classList.add('mobile-open');
        document.getElementById('sidebar-backdrop').classList.add('show');
        document.getElementById('sidebar-backdrop').classList.remove('hidden');
      };
      window.closeMobileSidebar = function () {
        sb.classList.remove('mobile-open');
        document.getElementById('sidebar-backdrop').classList.remove('show');
        document.getElementById('sidebar-backdrop').classList.add('hidden');
      };
    })();
    (function () {
      const ua = navigator.userAgent || '';
      const companion = /Home Assistant/i.test(ua) ||
        !!(window.externalApp || window.externalAppV2 ||
           (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.externalBus));
      const narrow = window.matchMedia('(max-width: 768px)').matches;
      if (companion) document.body.classList.add('is-companion');
      if (companion || narrow || /Android|iPhone|iPad/i.test(ua)) document.body.classList.add('is-mobile');
    })();
  </script>
  <script>
    (function () {
      document.addEventListener('click', function (e) {
        const btn = e.target.closest('button[type="submit"], input[type="submit"]');
        if (btn && btn.form) btn.form._submitter = btn;
      });
      document.addEventListener('submit', function (e) {
        const form = e.target;
        if (!form || (form.getAttribute('enctype') || '').toLowerCase() !== 'multipart/form-data') return;
        const files = Array.from(form.querySelectorAll('input[type="file"]')).filter(function (i) { return i.files && i.files.length; });
        if (!files.length) return;
        e.preventDefault();
        const bar = document.createElement('div');
        bar.id = 'upload-progress';
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid #e2e8f0;padding:12px 16px;box-shadow:0 -4px 16px rgba(15,23,42,.08)';
        bar.innerHTML = '<div style="display:flex;justify-content:space-between;font-size:13px;color:#334155;margin-bottom:6px"><span id="upload-progress-label">Uploading photo…</span><span id="upload-progress-pct">0%</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden"><div id="upload-progress-fill" style="height:100%;width:0;background:#0d9488;border-radius:999px"></div></div>';
        document.body.appendChild(bar);
        const data = new FormData(form);
        const submitter = form._submitter;
        if (submitter && submitter.name) data.append(submitter.name, submitter.value || '');
        const xhr = new XMLHttpRequest();
        xhr.open(form.method || 'POST', form.action);
        xhr.upload.onprogress = function (ev) {
          if (!ev.lengthComputable) return;
          const pct = Math.round(ev.loaded / ev.total * 100);
          document.getElementById('upload-progress-fill').style.width = pct + '%';
          document.getElementById('upload-progress-pct').textContent = pct + '%';
        };
        xhr.onload = function () {
          document.getElementById('upload-progress-fill').style.width = '100%';
          document.getElementById('upload-progress-label').textContent = 'Saving…';
          window.location.href = xhr.responseURL || form.action;
        };
        xhr.onerror = function () {
          document.getElementById('upload-progress-label').textContent = 'Upload failed. Try again.';
          document.getElementById('upload-progress-pct').textContent = '';
        };
        xhr.send(data);
      });
    })();
  </script>
  <script src="{{ request.headers.get('x-ingress-path', '') }}/static/filters.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
