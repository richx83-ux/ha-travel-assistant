<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Travel Assistant{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
              400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
              800: '#115e59', 900: '#134e4a'
            }
          },
          boxShadow: {
            'soft': '0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05)',
            'card': '0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05)'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --ui-bg: {{ ui.bg_color }};
      --ui-sidebar: {{ ui.sidebar_color }};
      --ui-sidebar-text: {{ ui.sidebar_text_color }};
      --ui-sidebar-active: {{ ui.sidebar_active_color }};
      --ui-accent: {{ ui.accent_color }};
    }
    .dark {
      --ui-bg: #0f172a;
      --ui-sidebar: #1e293b;
      --ui-sidebar-text: #e2e8f0;
      --ui-sidebar-active: #334155;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--ui-bg); }
    .dark body { color: #e2e8f0; }

    /* Cards and surfaces */
    .dark .bg-white {
      background-color: #1e293b !important;
      color: #e2e8f0;
    }
    .dark .bg-slate-50 {
      background-color: #334155 !important;
    }
    .dark .bg-slate-100 {
      background-color: #334155 !important;
    }

    /* Text contrast */
    .dark .text-slate-900 { color: #f8fafc !important; }
    .dark .text-slate-800 { color: #f1f5f9 !important; }
    .dark .text-slate-700 { color: #e2e8f0 !important; }
    .dark .text-slate-600 { color: #cbd5e1 !important; }
    .dark .text-slate-500 { color: #94a3b8 !important; }
    .dark .text-slate-400 { color: #64748b !important; }

    /* Borders and dividers */
    .dark .border-slate-200 { border-color: #334155 !important; }
    .dark .border-slate-300 { border-color: #475569 !important; }
    .dark .border-slate-100 { border-color: #1e293b !important; }
    .dark .divide-slate-100 > * + * { border-color: #334155 !important; }
    .dark .divide-slate-200 > * + * { border-color: #334155 !important; }

    /* All form controls — including date, time, file */
    .dark input,
    .dark textarea,
    .dark select {
      background-color: #0f172a !important;
      color: #f1f5f9 !important;
      border-color: #475569 !important;
    }
    .dark input::placeholder,
    .dark textarea::placeholder {
      color: #64748b !important;
    }
    .dark input[type="date"],
    .dark input[type="time"],
    .dark input[type="datetime-local"] {
      color-scheme: dark;
    }
    .dark input[type="file"] {
      background: transparent !important;
      color: #cbd5e1 !important;
    }
    .dark input[type="file"]::file-selector-button {
      background: #1e293b;
      color: #5eead4;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
    }

    /* Buttons that should stay readable */
    .dark button.bg-white,
    .dark a.bg-white,
    .dark .bg-white button {
      color: #e2e8f0 !important;
    }

    .leaflet-container { z-index: 0; background: #e2e8f0; }
    .dark .leaflet-container { background: #1e293b; }
    #sidebar { background: var(--ui-sidebar); color: var(--ui-sidebar-text); }
    #sidebar .nav-link { color: var(--ui-sidebar-text); opacity: 0.8; transition: all 0.15s ease; }
    #sidebar .nav-link:hover { background: var(--ui-sidebar-active); opacity: 1; }
    #sidebar .nav-link.nav-active {
      background: var(--ui-sidebar-active);
      opacity: 1;
      color: #fff;
      box-shadow: inset 3px 0 0 var(--ui-accent);
    }
    #sidebar .brand-icon { background: var(--ui-accent); }
    #main-header { background: color-mix(in srgb, var(--ui-bg) 92%, transparent); backdrop-filter: blur(12px); }
    .dark #main-header { border-color: #334155; }

    #sidebar.collapsed { width: 5rem; }
    #sidebar.collapsed .nav-label, #sidebar.collapsed .brand-text { display: none; }
    #sidebar.collapsed .nav-link { justify-content: center; padding: 0.75rem; }
    #main-wrap { margin-left: 16rem; transition: margin-left 0.2s ease; }
    #sidebar.collapsed ~ #main-wrap { margin-left: 5rem; }

    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.mobile-open { transform: translateX(0); }
      #main-wrap { margin-left: 0 !important; }
      #sidebar-backdrop.show { display: block; }
      button, .btn, a.px-4 { min-height: 44px; }
      .page-pad { padding-left: 1rem !important; padding-right: 1rem !important; }
    }

    .card { @apply bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-soft hover:shadow-card transition-shadow; }
    .btn-primary { @apply inline-flex items-center gap-2 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-xl shadow-sm transition-all hover:shadow; }
    .btn-secondary { @apply inline-flex items-center gap-2 px-4 py-2.5 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-sm font-medium rounded-xl hover:bg-slate-50 dark:hover:bg-slate-600 transition; }
    .progress-bar { @apply h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden; }
    .progress-fill { @apply h-full bg-brand-600 rounded-full transition-all duration-500; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full text-slate-800 dark:text-slate-100">
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden" onclick="closeMobileSidebar()"></div>

  <aside id="sidebar" class="fixed top-0 left-0 z-50 h-full w-64 flex flex-col transition-all duration-200 ease-in-out shadow-lg">
    <div class="sidebar-header flex items-center gap-3 px-4 h-16 border-b border-white/10 flex-shrink-0">
      <a href="{{ base }}/" class="brand-link flex items-center gap-3 min-w-0">
        <span class="brand-icon w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 shadow">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </span>
        <span class="brand-text font-semibold text-base truncate">Travel Assistant</span>
      </a>
      <button type="button" onclick="toggleSidebar()" class="collapse-btn-expanded ml-auto p-1.5 rounded-lg opacity-70 hover:opacity-100 hover:bg-white/10 hidden md:flex" title="Collapse">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
      </button>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="{{ base }}/" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium {% if active_nav == 'dashboard' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v2a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 13a1 1 0 011-1h4a1 1 0 011 1v6a1 1 0 01-1 1h-4a1 1 0 01-1-1v-6z"/></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="{{ base }}/themes" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium {% if active_nav == 'themes' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
        <span class="nav-label">Categories</span>
      </a>
      <a href="{{ base }}/places" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium {% if active_nav == 'places' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="nav-label">Places</span>
      </a>
      <a href="{{ base }}/trips" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium {% if active_nav == 'trips' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span class="nav-label">Trips</span>
      </a>
      <a href="{{ base }}/packing" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium {% if active_nav == 'packing' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span class="nav-label">Store cupboard</span>
      </a>
      <a href="{{ base }}/achievements" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium {% if active_nav == 'achievements' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
        <span class="nav-label">Achievements</span>
      </a>
    </nav>

    <div class="px-3 py-4 border-t border-white/10">
      <a href="{{ base }}/settings" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium {% if active_nav == 'settings' %}nav-active{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="nav-label">Settings</span>
      </a>
    </div>
  </aside>

  <div id="main-wrap" class="min-h-full flex flex-col">
    <header id="main-header" class="sticky top-0 z-30 border-b border-slate-200/80 h-14 flex items-center px-4 sm:px-6 lg:px-8 gap-3">
      <button type="button" onclick="openMobileSidebar()" class="md:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-black/5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="text-sm text-slate-500 dark:text-slate-400 flex-1">{% block topbar %}Travel Assistant{% endblock %}</div>
      <button type="button" id="theme-toggle" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-black/5" title="Toggle dark mode">
        <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </header>

    <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 max-w-7xl w-full mx-auto">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      const sb = document.getElementById('sidebar');
      const key = 'ta-sidebar-collapsed';
      try { if (localStorage.getItem(key) === '1' && window.innerWidth >= 768) sb.classList.add('collapsed'); } catch (e) {}
      window.toggleSidebar = function () {
        sb.classList.toggle('collapsed');
        try { localStorage.setItem(key, sb.classList.contains('collapsed') ? '1' : '0'); } catch (e) {}
      };
      window.openMobileSidebar = function () {
        sb.classList.add('mobile-open');
        document.getElementById('sidebar-backdrop').classList.remove('hidden');
        document.getElementById('sidebar-backdrop').classList.add('show');
      };
      window.closeMobileSidebar = function () {
        sb.classList.remove('mobile-open');
        document.getElementById('sidebar-backdrop').classList.add('hidden');
        document.getElementById('sidebar-backdrop').classList.remove('show');
      };

      // Dark mode
      const html = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('ta-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
      }
      toggle.addEventListener('click', () => {
        html.classList.toggle('dark');
        localStorage.setItem('ta-theme', html.classList.contains('dark') ? 'dark' : 'light');
      });
    })();

    window.fixMaps = function () {
      if (typeof L === 'undefined') return;
      document.querySelectorAll('.leaflet-container').forEach(function (el) {
        if (el._leaflet_id != null) {
          try {
            const mapInst = Object.values(L.Map._instances || {}).find(m => m.getContainer && m.getContainer() === el);
            if (mapInst) mapInst.invalidateSize();
          } catch (e) {}
        }
      });
    };
    setTimeout(window.fixMaps, 300);
    window.addEventListener('resize', window.fixMaps);
  </script>
  <script src="{{ request.headers.get('x-ingress-path', '') }}/static/filters.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
